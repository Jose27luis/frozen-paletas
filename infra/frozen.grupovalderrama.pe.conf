server {
    listen 80;
    listen [::]:80;
    server_name frozen.grupovalderrama.pe;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name frozen.grupovalderrama.pe;
    charset utf-8;
    client_max_body_size 8M;

    ssl_certificate /etc/letsencrypt/live/frozen.grupovalderrama.pe/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/frozen.grupovalderrama.pe/privkey.pem;

    root /var/www/frozen-paletas/frontend/dist/frontend/browser;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $esquema_real;
        proxy_read_timeout 120s;
    }

    location ~* "-[A-Za-z0-9]{8}\.(?:js|css)$" {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~* \.(?:js|css|woff2|woff|ttf|svg|png|jpg|jpeg|webp|ico)$ {
        expires 1h;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
